# 推送到 GitHub 后自动打包：Windows (optsim.exe) 和 Linux（Ubuntu 22.04 编译，兼容 22.04 及更新的 Xubuntu）
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib PySide6-Essentials pyinstaller
      - name: Build
        run: pyinstaller --noconfirm optsim.spec
      - uses: actions/upload-artifact@v4
        with:
          name: optsim-${{ runner.os }}
          path: dist/optsim
